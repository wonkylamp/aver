<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 628" width="800" height="628" role="img" aria-labelledby="t d">
<title id="t">Git&#x27;s building blocks, rebuilt for agents</title>
<desc id="d">Each Git building block beside the Aver block that replaces or extends it for agents: branch becomes workspace; commit (what changed) becomes receipt (proof it works); CI after push becomes check while working; branch protection becomes the frozen test harness; git bisect becomes the comparison of the original code with the change; merge becomes verified combine; log and blame become the ledger. Check while working, the frozen test harness and the comparison are highlighted as the three strongest.</desc>
<defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#a2abbd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#a5b9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#ff8f84" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#e7eaf1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="628" fill="#121725"/>
