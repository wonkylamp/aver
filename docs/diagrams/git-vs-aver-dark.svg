<text x="182.0" y="64" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="middle"><tspan>built for people</tspan></text>
<text x="592.0" y="42" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="20" font-weight="700" fill="#a5b9ff" text-anchor="middle"><tspan>Aver</tspan></text>
<text x="592.0" y="64" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="middle"><tspan>rebuilt for agents, on top of Git</tspan></text>
<rect x="32" y="84" width="300" height="56" rx="10" fill="#121725" stroke="#3b4560" stroke-width="1.5"/>
<text x="52" y="109" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#e7eaf1" text-anchor="start"><tspan>branch</tspan></text>
<text x="52" y="129" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>a line of work</tspan></text>
<rect x="416" y="84" width="352" height="56" rx="10" fill="#1a2132" stroke="#3b4560" stroke-width="1.5"/>
<text x="436" y="109" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e7eaf1" text-anchor="start"><tspan>Workspace</tspan></text>
<text x="436" y="129" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>an instant copy for each agent</tspan></text>
<path d="M344,112 H404" fill="none" stroke="#a2abbd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="32" y="152" width="300" height="56" rx="10" fill="#121725" stroke="#3b4560" stroke-width="1.5"/>
<text x="52" y="177" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#e7eaf1" text-anchor="start"><tspan>commit</tspan></text>
<text x="52" y="197" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>what changed</tspan></text>
