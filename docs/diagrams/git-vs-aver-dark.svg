<text x="436" y="197" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>proof it works</tspan></text>
<path d="M344,180 H404" fill="none" stroke="#a2abbd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
