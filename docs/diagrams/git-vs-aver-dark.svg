<text x="52" y="517" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#e7eaf1" text-anchor="start"><tspan>log / blame</tspan></text>
<text x="52" y="537" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>who changed each line</tspan></text>
<rect x="416" y="492" width="352" height="56" rx="10" fill="#1a2132" stroke="#3b4560" stroke-width="1.5"/>
<text x="436" y="517" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e7eaf1" text-anchor="start"><tspan>Ledger</tspan></text>
<text x="436" y="537" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>every attempt, its verdict and why</tspan></text>
