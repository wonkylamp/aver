<text x="52" y="245" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e7eaf1" text-anchor="start"><tspan>CI after push</tspan></text>
<text x="52" y="265" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>minutes later, after the fact</tspan></text>
<rect x="416" y="220" width="352" height="56" rx="10" fill="#232b45" stroke="#a5b9ff" stroke-width="1.75"/>
<text x="436" y="245" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#a5b9ff" text-anchor="start"><tspan>Check while working</tspan></text>
<text x="436" y="265" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#e7eaf1" text-anchor="start"><tspan>about a second, before any push</tspan></text>
<path d="M344,248 H404" fill="none" stroke="#a5b9ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<rect x="32" y="288" width="300" height="56" rx="10" fill="#121725" stroke="#3b4560" stroke-width="1.5"/>
<text x="52" y="313" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e7eaf1" text-anchor="start"><tspan>branch protection</tspan></text>
<text x="52" y="333" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>rules for who merges</tspan></text>
<rect x="416" y="288" width="352" height="56" rx="10" fill="#232b45" stroke="#a5b9ff" stroke-width="1.75"/>
<text x="436" y="313" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#a5b9ff" text-anchor="start"><tspan>Frozen test harness</tspan></text>
<text x="436" y="333" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#e7eaf1" text-anchor="start"><tspan>the agent cannot weaken the tests</tspan></text>
<path d="M344,316 H404" fill="none" stroke="#a5b9ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<rect x="32" y="356" width="300" height="56" rx="10" fill="#121725" stroke="#3b4560" stroke-width="1.5"/>
<text x="52" y="381" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#e7eaf1" text-anchor="start"><tspan>git bisect</tspan></text>
<text x="52" y="401" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>hunt for the culprit later</tspan></text>
<rect x="416" y="356" width="352" height="56" rx="10" fill="#232b45" stroke="#a5b9ff" stroke-width="1.75"/>
<text x="436" y="381" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#a5b9ff" text-anchor="start"><tspan>Original vs change</tspan></text>
<text x="436" y="401" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#e7eaf1" text-anchor="start"><tspan>every failing test gets a cause</tspan></text>
<path d="M344,384 H404" fill="none" stroke="#a5b9ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
