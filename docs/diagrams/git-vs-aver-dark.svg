<text x="52" y="449" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#e7eaf1" text-anchor="start"><tspan>merge</tspan></text>
<text x="52" y="469" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>joins the text, untested</tspan></text>
<rect x="416" y="424" width="352" height="56" rx="10" fill="#1a2132" stroke="#3b4560" stroke-width="1.5"/>
<text x="436" y="449" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e7eaf1" text-anchor="start"><tspan>Verified combine</tspan></text>
<text x="436" y="469" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>lands only if every task passes</tspan></text>
<path d="M344,452 H404" fill="none" stroke="#a2abbd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
