<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">How Aver works</title>
<desc id="d">Your agents, such as Claude Code, Codex and Cursor, each get an instant workspace. Each agent works and runs aver check as it goes. aver verify compares its change with the original code and writes a signed receipt, and only proven work lands in Git as a branch or pull request. An agent whose change broke parseDate is told it is not done and goes back to work instead of reaching Git.</desc>
