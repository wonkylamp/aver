<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="t d">
<title id="t">The comparison at the heart of Aver</title>
<desc id="d">Aver runs the same frozen tests on two sides: the original code with the agent&#x27;s new tests added, and the agent&#x27;s change. A test that passes on the original and fails on the change means you broke it (FAIL_OWN). A test that fails on both was already broken, not your fault (PREEXISTING). A new test that fails on the original and passes on the change is proof (PASS). A test that passes on both proves nothing. A test that fails only sometimes is flaky and not counted against the agent (FLAKY). If the agent edited a test or the harness, a human should look (REVIEW).</desc>
<defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#a2abbd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#a5b9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#ff8f84" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#e7eaf1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="640" fill="#121725"/>
<rect x="32" y="28" width="360" height="72" rx="10" fill="#121725" stroke="#3b4560" stroke-width="1.5"/>
<text x="212" y="58" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e7eaf1" text-anchor="middle"><tspan>Original code</tspan></text>
<text x="212" y="82" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="middle"><tspan>with the agent’s new tests added</tspan></text>
<rect x="408" y="28" width="360" height="72" rx="10" fill="#121725" stroke="#3b4560" stroke-width="1.5"/>
<text x="588" y="58" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e7eaf1" text-anchor="middle"><tspan>The agent’s change</tspan></text>
<text x="588" y="82" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="middle"><tspan>the code it wants to land</tspan></text>
<rect x="32" y="112" width="736" height="36" rx="18" fill="#232b45" stroke="#a5b9ff" stroke-width="1.75"/>
<rect x="52" y="127" width="14" height="11" rx="2" fill="none" stroke="#a5b9ff" stroke-width="1.6"/>
<path d="M55,127 V124 a4,4 0 0 1 8,0 V127" fill="none" stroke="#a5b9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="734" y="127" width="14" height="11" rx="2" fill="none" stroke="#a5b9ff" stroke-width="1.6"/>
<path d="M737,127 V124 a4,4 0 0 1 8,0 V127" fill="none" stroke="#a5b9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="400" y="135" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#e7eaf1" text-anchor="middle"><tspan>the same frozen tests and harness on both sides</tspan></text>
<text x="340.0" y="184" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e7eaf1" text-anchor="middle"><tspan>passes on the change</tspan></text>
<text x="632.0" y="184" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e7eaf1" text-anchor="middle"><tspan>fails on the change</tspan></text>
<text x="184" y="252.0" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e7eaf1" text-anchor="end"><tspan>passes on</tspan></text>
<text x="184" y="274.0" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e7eaf1" text-anchor="end"><tspan>the original</tspan></text>
<text x="184" y="376.0" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e7eaf1" text-anchor="end"><tspan>fails on</tspan></text>
<text x="184" y="398.0" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e7eaf1" text-anchor="end"><tspan>the original</tspan></text>
<rect x="200" y="200" width="280" height="112" rx="10" fill="#1a2132" stroke="#3b4560" stroke-width="1.5"/>
<text x="340.0" y="252" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e7eaf1" text-anchor="middle"><tspan>nothing to report</tspan></text>
<text x="340.0" y="276" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="middle"><tspan>a new test here proves nothing</tspan></text>
<rect x="492" y="200" width="280" height="112" rx="10" fill="#33242c" stroke="#ff8f84" stroke-width="1.75"/>
<text x="632.0" y="238" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ff8f84" text-anchor="middle"><tspan>you broke it</tspan></text>
<text x="632.0" y="262" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="middle"><tspan>it passed before the change</tspan></text>
<rect x="587.4" y="274.0" width="89.2" height="26" rx="13.0" fill="#121725" stroke="#ff8f84" stroke-width="1.25"/>
<text x="632.0" y="292.04" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#ff8f84" text-anchor="middle"><tspan>FAIL_OWN</tspan></text>
<rect x="200" y="324" width="280" height="112" rx="10" fill="#232b45" stroke="#a5b9ff" stroke-width="1.75"/>
<text x="340.0" y="362" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="20" font-weight="700" fill="#a5b9ff" text-anchor="middle"><tspan>proven</tspan></text>
<text x="340.0" y="386" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="middle"><tspan>the agent’s new test shows it works</tspan></text>
<rect x="312.2" y="398.0" width="55.6" height="26" rx="13.0" fill="#121725" stroke="#a5b9ff" stroke-width="1.25"/>
<text x="340.0" y="416.04" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#a5b9ff" text-anchor="middle"><tspan>PASS</tspan></text>
<rect x="492" y="324" width="280" height="112" rx="10" fill="#1a2132" stroke="#3b4560" stroke-width="1.5"/>
<text x="632.0" y="362" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e7eaf1" text-anchor="middle"><tspan>already broken</tspan></text>
<text x="632.0" y="386" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="middle"><tspan>not your fault</tspan></text>
<rect x="574.8" y="398.0" width="114.4" height="26" rx="13.0" fill="#121725" stroke="#3b4560" stroke-width="1.25"/>
<text x="632.0" y="416.04" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#a2abbd" text-anchor="middle"><tspan>PREEXISTING</tspan></text>
<rect x="32" y="460" width="736" height="52" rx="10" fill="#1a2132" stroke="#3b4560" stroke-width="1.5"/>
<text x="52" y="492" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>a test fails sometimes</tspan></text>
<text x="372" y="492" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e7eaf1" text-anchor="start"><tspan>flaky: not counted against you</tspan></text>
<rect x="684.0" y="473.0" width="64.0" height="26" rx="13.0" fill="#121725" stroke="#3b4560" stroke-width="1.25"/>
<text x="716.0" y="491.04" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#a2abbd" text-anchor="middle"><tspan>FLAKY</tspan></text>
<rect x="32" y="524" width="736" height="52" rx="10" fill="#1a2132" stroke="#3b4560" stroke-width="1.5"/>
<text x="52" y="556" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a2abbd" text-anchor="start"><tspan>the agent edited a test or the harness</tspan></text>
<text x="372" y="556" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e7eaf1" text-anchor="start"><tspan>a human should look</tspan></text>
<rect x="675.6" y="537.0" width="72.4" height="26" rx="13.0" fill="#121725" stroke="#3b4560" stroke-width="1.25"/>
<text x="711.8" y="555.04" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#a2abbd" text-anchor="middle"><tspan>REVIEW</tspan></text>
<text x="400.0" y="614" xml:space="preserve" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a2abbd" text-anchor="middle"><tspan>Same frozen tests, before and after: every failing test gets a cause.</tspan></text>
</svg>
