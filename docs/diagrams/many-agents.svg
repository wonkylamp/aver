<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 612" width="800" height="612" role="img" aria-labelledby="t d">
<title id="t">Many agents, many tasks</title>
<desc id="d">One repository, four tasks in parallel, each agent in its own workspace. Tasks 2 and 3 both change src/parse.ts, and both agents are told while they work. Tasks 1, 2 and 3 pass; task 4 broke something (FAIL_OWN) and stays out. aver combine merges the passing tasks and checks the result against every task, then it lands in Git as one branch ready for a pull request. If the changes conflict, the combine is refused and nothing broken lands.</desc>
