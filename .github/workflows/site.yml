name: Site

# Builds and tests site/ on every change to it. Pushes to main deploy it to
# Cloudflare Pages only while the repository variable SITE_DEPLOY is
# 'true'; pull requests never deploy.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "schemas/vectors/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "schemas/vectors/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: npm ci --prefix site --no-audit --no-fund

      - name: Test
        working-directory: site
        run: npm test

      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      - name: Build
        working-directory: site
        run: npm run --silent build

      - name: Check the committed bundles are current
        run: |
          git diff --quiet -- site || echo "::warning title=Stale site bundles::make site changed $(git diff --name-only -- site | tr '\n' ' '); commit the rebuilt files"

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: pages deploy site --project-name=aver --branch=main --commit-dirty=true
