name: Release

# A tag v<major>.<minor>.<patch>[-<pre>] on a commit of main whose ci-ok
# passed releases it (docs/RELEASING.md): the gate, four binaries built and
# smoke-tested, a draft release with provenance, install.sh on clean macOS
# and Linux runners against the draft, publication, a check of the public
# download, and then the tap, the action's series tag and the plugin's
# version. Series tags such as v0.4 do not match, so moving one never
# starts a release. ci.yml's tag job tags a merged version bump and
# dispatches this workflow on the tag, since its GITHUB_TOKEN's tag push
# starts nothing.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      series: ${{ steps.gate.outputs.series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: packaging/release/gate.sh "$GITHUB_REF" "$GITHUB_SHA"

  # Release builds skip the cargo cache so a poisoned cache cannot reach a
  # published binary. Asset names are aver-<os>-<arch>; site/install.sh,
  # action/install-aver.sh and packaging/homebrew/aver.rb depend on them.
  # Linux binaries are static musl, so they run on any distribution and
  # binstall's gnu and musl targets can share one asset.
  build:
    needs: gate
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: aver-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: aver-linux-aarch64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: aver-darwin-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: aver-darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends musl-tools
      # aver init --ci pins the action to the commit this release is built from.
      - name: Build
        env:
          AVER_ACTION_SHA: ${{ github.sha }}
        run: packaging/release/build.sh "${{ matrix.target }}" "${{ matrix.asset }}"
      - name: Smoke test
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: packaging/release/smoke.sh "dist/${{ matrix.asset }}" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  # Each binary keeps its own .sha256, which action/install-aver.sh reads.
  # SHA256SUMS lists all four for site/install.sh and the Homebrew formula.
  draft:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the binaries and write SHA256SUMS
        run: packaging/release/sums.sh dist
      # Signed SLSA provenance for each binary SHA256SUMS lists, checked
      # with `gh attestation verify <file> --repo wonkylamp/aver`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: packaging/release/draft.sh "$GITHUB_REF_NAME" dist "$PRERELEASE"

  # install.sh on runners that never built aver, against the draft's assets.
  install:
    needs: [gate, draft]
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: packaging/release/install-check.sh "$GITHUB_REF_NAME" "$VERSION" draft

  publish:
    needs: [gate, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: packaging/release/publish.sh "$GITHUB_REF_NAME" "$PRERELEASE"
      # The public download, with no token, as a user gets it.
      - name: Install the published release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: packaging/release/install-check.sh "$GITHUB_REF_NAME" "$VERSION" tag
      - name: Install the latest release
        if: needs.gate.outputs.prerelease == 'false'
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: packaging/release/install-check.sh "$GITHUB_REF_NAME" "$VERSION" latest

  # Which of the optional tokens this repository has. A job cannot test a
  # secret in its own if:, so the jobs that need one read these outputs and
  # show as skipped without it.
  tokens:
    needs: publish
    runs-on: ubuntu-latest
    outputs:
      tap: ${{ steps.check.outputs.tap }}
      pr: ${{ steps.check.outputs.pr }}
    steps:
      - id: check
        env:
          TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
          PR: ${{ secrets.RELEASE_PR_TOKEN != '' }}
        run: |
          echo "tap=$TAP" >>"$GITHUB_OUTPUT"
          echo "pr=$PR" >>"$GITHUB_OUTPUT"
          [ "$TAP" = true ] || echo "::notice title=Homebrew tap not updated::HOMEBREW_TAP_TOKEN is not set; run packaging/release/update-tap.sh by hand (docs/RELEASING.md)"
          [ "$PR" = true ] || echo "::notice title=Plugin version not bumped::RELEASE_PR_TOKEN is not set; run packaging/release/bump-plugin.sh by hand (docs/RELEASING.md)"

  homebrew:
    needs: [gate, tokens]
    if: needs.tokens.outputs.tap == 'true' && needs.gate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: packaging/release/update-tap.sh "$VERSION"

  # The released commit as v<major>.<minor>, for `uses: wonkylamp/aver/action@v0.4`.
  action-tag:
    needs: [gate, publish]
    if: needs.gate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERIES: ${{ needs.gate.outputs.series }}
        run: packaging/release/move-tag.sh "$SERIES" "$GITHUB_SHA"

  plugin:
    needs: [gate, tokens]
    if: needs.tokens.outputs.pr == 'true' && needs.gate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - env:
          PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: packaging/release/bump-plugin.sh "$VERSION"
