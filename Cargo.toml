[workspace]
resolver = "2"
members = ["crates/aver-core", "crates/aver"]

[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
aver-core = { path = "crates/aver-core" }

anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
ignore = "0.4.33"
jsonschema = { version = "0.58.6", default-features = false }
libc = "0.2.190"
parking_lot = "0.12.5"
quick-xml = "0.42.0"
rand = "0.10.3"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"
zstd = "0.14.2"

[profile.dev]
debug = 0

[profile.test]
debug = 0
