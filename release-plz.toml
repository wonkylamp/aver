# Only tags: merging a version bump to main tags v<version> (ci.yml's tag
# job, docs/RELEASING.md). Nothing goes to crates.io, release-plz opens no
# release pull requests and makes no GitHub release (release.yml does).
[workspace]
git_only = true
git_release_enable = false
git_tag_name = "v{{ version }}"
changelog_update = false
semver_check = false

[[package]]
name = "aver-core"
release = false
