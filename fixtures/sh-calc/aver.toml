# Shell only: verifies natively with neither Node nor Docker (the custody
# tests in crates/aver/tests/custody).
[env]
image = "node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392"

[limits]
timeout_s = 60

[[check]]
id     = "unit"
run    = ["sh", "test/run.sh", "/aver/out/unit.xml"]
report = { format = "junit", path = "/aver/out/unit.xml" }
covers = ["*.sh", "test/**"]
